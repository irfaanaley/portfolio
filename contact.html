<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contact | Irfan Ali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff3b1f;
            --ink: #0a0a0a;
            --paper: #fff;
            --soft: #f4f4f4;
            --mute: #555;
            --line: #ddd;
            --display: Anton, Impact, "Arial Narrow", sans-serif;
            --body: Inter, system-ui, sans-serif;
        }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 400 15px/1.6 var(--body);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }
        .wrap {
            max-width: 500px;
            width: 100%;
            padding: 0 24px;
        }
        .contact-card {
            background: var(--paper);
            padding: 40px;
            border: 1px solid var(--line);
            border-radius: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font: 400 clamp(32px,8vw,48px)/.88 var(--display);
            text-transform: uppercase;
            margin: 0 0 10px;
            letter-spacing: -0.01em;
        }
        h1 em {
            color: var(--red);
            font-style: normal;
        }
        p {
            color: var(--mute);
            font-size: 14px;
            margin: 0 0 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font: 700 11px var(--body);
            letter-spacing: .08em;
            text-transform: uppercase;
            margin: 0 0 8px;
            color: var(--ink);
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: var(--soft);
            border: 1px solid var(--line);
            border-radius: 0;
            color: var(--ink);
            font: 400 14px var(--body);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--red);
        }
        .btn {
            display: block;
            width: 100%;
            background: var(--ink);
            color: #fff;
            font: 700 11px var(--body);
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 14px;
            border: 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--red);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            font: 700 11px var(--body);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--mute);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--red);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="contact-card">
            <h1>Let's <em>talk</em> ↗</h1>
            <p>Have a project, an internship, or just want to say hi?</p>
            <div style="margin-bottom: 20px;">
                <a href="https://www.linkedin.com/in/irfan-ali-74aa73422" target="_blank" style="color: var(--red); text-decoration: none; font-weight: bold; font-size: 14px;">Follow me on LinkedIn ↗</a>
            </div>
            <form action="https://formspree.io/f/mvkzqwly" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="5" placeholder="How can I help you?" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <a href="index.html" class="back-link">← Back to Portfolio</a>
        </div>
    </div>
</body>
</html>
